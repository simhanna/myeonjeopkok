services:
  - type: web
    name: myeonjeopkok-simhanna-tts
    runtime: python
    rootDir: tts_server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://simhanna.github.io,https://myeonjeopkok.onrender.com"
