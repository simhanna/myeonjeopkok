services:
  - type: web
    name: myeonjeopkok-simhanna-tts
    runtime: node
    rootDir: tts_server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://simhanna.github.io,https://myeonjeopkok.onrender.com"
