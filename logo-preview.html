<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>면접콕 로고 미리보기</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#172033;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}.app{max-width:1440px;margin:auto;min-height:100vh;background:#fff}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #dfe8ef;background:#fff}.brand{display:flex;align-items:center;gap:12px}.bot{width:42px;height:42px;border-radius:15px;background:#eaf6ff;display:grid;place-items:center;overflow:hidden}.bot img{width:42px;height:42px;object-fit:cover;border-radius:15px}.logo{font-size:25px;font-weight:900;color:#4ea5eb;letter-spacing:-.8px}.sub{font-size:12px;color:#6f7c8d;margin-top:2px}.user{display:flex;align-items:center;gap:9px}.avatar{width:36px;height:36px;border-radius:50%;background:#eaf6ff;color:#4ea5eb;display:grid;place-items:center;font-weight:900}.stage{padding:26px}.card{border:1px solid #dfe8ef;border-radius:18px;background:#fff;padding:22px}.note{color:#6f7c8d;font-size:13px;line-height:1.6}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="bot"><img src="logo.svg" alt="면접콕 로고"></div><div><div class="logo">면접콕</div><div class="sub">AI 자기소개서 · 면접 도우미</div></div></div><div class="user"><div class="avatar">심</div><div><b style="font-size:13px">심한나</b><div class="sub">로그아웃</div></div></div></header><main class="stage"><div class="card"><b>로고 교체 미리보기</b><p class="note">상단 로봇 아이콘 대신 새 로고를 넣었을 때의 모습입니다. 메인 앱 기능은 건드리지 않은 미리보기 페이지예요.</p></div></main></div></body></html>
